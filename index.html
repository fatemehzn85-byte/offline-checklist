<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>چک‌لیست پلان</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d1f23;--mut:#6b7280;--ok:#16a34a;--bad:#dc2626;--na:#9ca3af;--pri:#1d4ed8;--wr:#f59e0b;--ln:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,"Noto Sans Arabic",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
#top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
#top .ttl{font-weight:700;font-size:17px}
#top .sub{font-size:12px;opacity:.85}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
#main{max-width:760px;margin:0 auto;padding:10px 10px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 4px;color:var(--mut);font-size:12px}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:9px 14px;min-height:42px}
.btn.o{background:#fff;color:var(--pri)}
.btn.d{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.s{padding:5px 10px;min-height:34px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
details.sec{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin:8px 0;overflow:hidden}
details.sec>summary{padding:11px 12px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"◂";color:var(--mut)}
details.sec[open]>summary::before{content:"▾"}
.badge{font-size:11px;border-radius:999px;padding:0 8px;font-weight:400}
.bd-bad{background:#fee2e2;color:var(--bad)} .bd-ok{background:#dcfce7;color:var(--ok)} .bd-pl{background:#e0e7ff;color:var(--pri)}
.it{padding:9px 12px;border-top:1px solid var(--ln)}
.it .tx{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 12px;min-height:38px;font-size:13px}
.chip b{margin-right:4px}
.st-ok{background:#dcfce7;border-color:var(--ok)} .st-ok b{color:var(--ok)}
.st-bad{background:#fee2e2;border-color:var(--bad)} .st-bad b{color:var(--bad)}
.st-na{background:#f1f5f9;color:#64748b}
.rc{box-shadow:0 0 0 2px var(--wr)}
.allok{border:1px dashed var(--ok);color:var(--ok);background:#fff;border-radius:999px;padding:4px 10px;min-height:38px;font-size:12px}
textarea,input[type=text],input[type=date],select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;background:#fff}
textarea{min-height:70px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.secnote{padding:8px 12px 12px;border-top:1px solid var(--ln)}
.tag{font-size:12px;background:#eef2ff;color:var(--pri);border-radius:6px;padding:0 8px}
.urg{font-size:12px;background:var(--bad);color:#fff;border-radius:6px;padding:0 8px}
.card.fx{opacity:.65}
.nt{background:#fffbeb;border-radius:8px;padding:6px 8px;margin:6px 0;white-space:pre-wrap}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
.ph .w{position:relative}
.ph .w button{position:absolute;top:-6px;left:-6px;background:var(--bad);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;z-index:30;display:none}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{flex:1;min-width:80px;text-align:center;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:6px}
.stat b{display:block;font-size:20px}
.spr{display:flex;gap:6px;margin:4px 0}
.hint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px 10px;font-size:13px}
#pa{display:none;direction:rtl;font-family:Tahoma,Arial,sans-serif;font-size:12px}
#pa h1{font-size:18px;margin:0 0 4px} #pa h3{font-size:13px;margin:10px 0 4px;background:#eee;padding:2px 6px}
#pa table{width:100%;border-collapse:collapse} #pa td,#pa th{border:1px solid #888;padding:3px 5px;vertical-align:top;text-align:right}
#pa img{max-height:80px;margin:2px}
@media print{body>*{display:none!important}body>#pa{display:block!important}@page{size:A4;margin:10mm}}
</style></head><body>
<div id="top"></div><div id="main"></div>
<nav id="nav"><button data-act="tab" data-t="proj"><b>🗂</b>پروژه‌ها</button><button data-act="tab" data-t="list"><b>☑</b>چک‌لیست</button><button data-act="tab" data-t="rep"><b>📋</b>گزارش ایرادها</button></nav>
<div id="modal"></div><div id="toast"></div><div id="pa"></div>
<script>
const SEC=[["اطلاعات کلی شیت", ["نام پروژه، کارفرما، آدرس و کد پروژه درست و یکدست است", "شماره شیت و عنوان پلان درست است", "مقیاس نوشته‌شده با مقیاس واقعی پلات یکی است", "شماره ریویژن و تاریخ آخرین تغییر به‌روز است", "جهت شمال مشخص است", "لجند و علائم اختصاری کامل است", "فرمت و قاب کاغذ درست است"]], ["محورها و ابعاد کلی", ["محورگذاری کامل و مرتب است", "اندازه‌گذاری بین محورها و ابعاد کل بنا (سه‌ردیفه) هست", "جمع ابعاد جزئی با بعد کل می‌خونه", "پلان با ابعاد زمین و عقب‌نشینی‌ها هم‌خوان است"]], ["دیوارها و سازه", ["ضخامت دیوارها (خارجی، داخلی، جداکننده) درست و یکدست است", "ستون‌ها و دیوارهای باربر با نقشه سازه هم‌خوان‌اند", "ستون‌ها در طبقات هم‌راستا هستند", "درز انقطاع، پیش‌آمدگی و پس‌رفتگی‌ها مشخص است", "جنس/نوع دیوارها (هاشور یا کد) مشخص است"]], ["درها", ["همه درها کد دارند و با جدول درها می‌خونند", "عرض و جهت بازشو درست است", "در به در، مبلمان یا دیوار برخورد نمی‌کند", "فضای کافی جلوی درها هست", "درهای ورودی، اضطراری و سرویس با نوع مناسب آمده‌اند"]], ["پنجره‌ها و نورگیرها", ["همه پنجره‌ها کد دارند و با جدول می‌خونند", "عرض، ارتفاع جان‌پناه و جهت بازشو مشخص است", "فضاهای اصلی نورگیری کافی دارند", "سرویس‌ها و شفت‌ها تهویه مناسب دارند", "پنجره‌ها با نما و برش‌ها هم‌خوان‌اند"]], ["فضاها و مساحت‌ها", ["همه فضاها نام یا شماره دارند", "مساحت هر فضا نوشته و درست محاسبه شده", "ابعاد حداقلی فضاها طبق مقررات رعایت شده", "جدول مساحت‌ها (زیربنا، مفید، مشاعات) با پلان یکی است", "فضای بی‌نام یا بی‌کاربری نمانده"]], ["گردش و ارتباط عمودی", ["مسیر حرکت از ورودی تا همه فضاها منطقی است", "عرض راهروها مناسب است", "پله: عرض، تعداد، ارتفاع و کف پله، پاگرد و جهت صعود مشخص است", "آسانسور و موتورخانه جانمایی و ابعادش درست است", "رمپ (در صورت وجود) شیب و عرض مناسب دارد", "خروج اضطراری و دسترسی معلولین بررسی شده"]], ["سرویس‌ها و تأسیسات", ["چاه، شفت‌ها، داکت‌ها و دودکش‌ها با نقشه تأسیسات هم‌خوان است", "سرویس‌های بهداشتی: ابعاد، فاصله وسایل و جهت بازشو درست است", "آشپزخانه: سینک، اجاق، یخچال و هود مشخص است", "پکیج، کنتورها، تابلو برق و اسپلیت/فن‌کوئل پیش‌بینی شده", "کفشوی و شیب کف در فضاهای مرطوب دیده شده"]], ["ترازها و ارتفاعات", ["تراز صفر و ترازهای هر طبقه مشخص است", "اختلاف ارتفاع کف‌ها (حمام، تراس، ورودی) نوشته شده", "ارتفاع سقف‌ها با برش‌ها هم‌خوان است", "تراز پله‌ها، رمپ و نشیمن‌ها درست است"]], ["مبلمان و تجهیزات ثابت", ["چیدمان واقع‌بینانه و با ابعاد درست است", "فاصله‌های ارگونومیک (مبل، تخت، میز غذاخوری، کابینت) رعایت شده", "مبلمان با در، پنجره و رادیاتور تداخل ندارد", "تجهیزات ثابت (کابینت، کمد دیواری، ویترین) مشخص است"]], ["ارجاعات و علائم", ["خطوط برش و جهت دید درست است", "ارجاع به نماها، برش‌ها و دیتیل‌ها درست و کامل است", "علائم تراز، شیب و ارتفاع خوانا است", "شماره‌گذاری نقشه‌های ارجاعی با فهرست نقشه‌ها یکی است"]], ["ظاهر و استاندارد ترسیم", ["ضخامت خطوط سلسله‌مراتب مشخص دارد", "لایه‌بندی منظم است و لایه اضافی نمانده", "ارتفاع و فونت متن‌ها خوانا و یکدست است", "هاشورها و رنگ‌ها استاندارد و یکدست است", "متن، اندازه‌گذاری و علائم همپوشانی ندارند"]], ["مقررات و ضوابط", ["مبحث‌های مرتبط (معماری، آتش‌نشانی، معلولین، تأسیسات) بررسی شده", "ضوابط شهرداری (تراکم، پوشش، عقب‌نشینی، پارکینگ) رعایت شده", "تعداد و ابعاد پارکینگ و مسیر رمپ درست است", "شرایط خاص پروژه (تفکیک، مشاعات، قوانین مجتمع) رعایت شده"]], ["هماهنگی بین شیت‌ها", ["پلان با نما و برش‌ها مطابقت دارد", "پلان با نقشه سازه هماهنگ است", "پلان با نقشه تأسیسات و برق هماهنگ است", "سقف کاذب/نورپردازی و کف‌سازی با پلان اصلی تداخل ندارد", "تغییرات آخر در همه شیت‌ها اعمال شده"]], ["بازبینی نهایی", ["کل پلان را روی کاغذ یا زوم‌اوت بررسی کردم", "غلط املایی و واحدها (متر/سانتی‌متر/میلی‌متر) چک شد", "فایل با نام و ریویژن درست ذخیره شده", "PDF خروجی با فایل اصلی مطابقت دارد"]]];
const PLAN=new Set([1,2,7,11,12,13,14,15]);
const ICON={ok:'✔',bad:'✖',na:'—',todo:'○'};
const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fdate=iso=>{try{return new Date(iso).toLocaleDateString('fa-IR')}catch(e){return iso}};
const KEY='plancheck.v1';
let DB=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{projects:[],cur:null}}catch(e){return{projects:[],cur:null}}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('حافظه پر است؛ از پروژه‌ها پشتیبان بگیر')}}
let tab='proj',filt='all',repFilt='all',openSecs=new Set([1]);
const P=()=>DB.projects.find(x=>x.id===DB.cur);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
// ---- photos (IndexedDB)
const idb=new Promise(res=>{try{const r=indexedDB.open('plancheck',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function phPut(id,v){const d=await idb;if(!d)return;return new Promise(r=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').put(v,id);t.oncomplete=r;t.onerror=r})}
async function phGet(id){const d=await idb;if(!d)return null;return new Promise(r=>{const q=d.transaction('ph').objectStore('ph').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function phDel(id){const d=await idb;if(!d)return;return new Promise(r=>{const t=d.transaction('ph','readwrite');t.objectStore('ph').delete(id);t.oncomplete=r;t.onerror=r})}
function resize(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=u})}
async function fillPhotos(root){for(const im of (root||document).querySelectorAll('img[data-ph]')){if(im.src)continue;const d=await phGet(im.dataset.ph);if(d)im.src=d}}
// ---- model
function newProject(o){return{id:uid(),name:o.name||'پروژه جدید',client:o.client||'',sheet:o.sheet||'',reviewer:o.reviewer||'',date:o.date||today(),rev:1,spaces:(o.spaces&&o.spaces.length?o.spaces:['فضا ۱','فضا ۲','فضا ۳']).map(n=>({id:uid(),name:n})),checks:{},secNotes:{},history:[]}}
const cellsOf=(p,i)=>PLAN.has(i)?[{sid:'plan',name:'کل پلان'}]:p.spaces.map(s=>({sid:s.id,name:s.name||'؟'}));
const ck=(i,j,sid)=>i+'.'+j+'.'+sid;
function stats(p){let t=0,ok=0,bad=0,na=0,fixed=0,urg=0;SEC.forEach(([_,items],a)=>{const i=a+1;items.forEach((_,j)=>cellsOf(p,i).forEach(c=>{t++;const e=p.checks[ck(i,j,c.sid)];if(!e||!e.st)return;if(e.st==='ok')ok++;else if(e.st==='na')na++;else if(e.st==='bad'){if(e.fix==='fixed')fixed++;else{bad++;if(e.pri==='urgent')urg++}}}))});const rev=ok+na+bad+fixed;return{t,ok,bad,na,fixed,urg,todo:t-rev,pct:t?Math.round(rev/t*100):0}}
function issues(p){const L=[];SEC.forEach(([sn,items],a)=>{const i=a+1;items.forEach((tx,j)=>cellsOf(p,i).forEach(c=>{const e=p.checks[ck(i,j,c.sid)];if(e&&e.st==='bad')L.push({i,j,sid:c.sid,sn,tx,sp:c.name,e,key:ck(i,j,c.sid)})}))});return L}
// ---- render
function render(){const sy=window.scrollY;let p=P();if(!p&&tab!=='proj')tab='proj';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(tab==='proj'||!p){$('top').innerHTML='<div class="ttl">چک‌لیست بازبینی پلان</div><div class="sub">کار آفلاین · ذخیره روی همین دستگاه</div>';$('main').innerHTML=viewProj()}
 else{const s=stats(p);$('top').innerHTML=`<div class="ttl">${esc(p.name)}</div><div class="sub">${p.sheet?'شیت '+esc(p.sheet)+' · ':''}ریویژن ${fa(p.rev)} · ${fa(s.pct)}٪ بررسی‌شده</div><div class="bar"><i style="width:${s.pct}%"></i></div>`;
  $('main').innerHTML=tab==='list'?viewList(p,s):viewRep(p,s)}
 fillPhotos($('main'));window.scrollTo(0,sy)}
function viewProj(){const L=DB.projects.map(p=>{const s=stats(p);return`<div class="card" data-act="open" data-id="${p.id}" style="cursor:pointer"><div class="row" style="justify-content:space-between"><b>${esc(p.name)}</b><span class="mut">ریویژن ${fa(p.rev)}</span></div><div class="mut">${p.client?esc(p.client)+' · ':''}${p.sheet?'شیت '+esc(p.sheet)+' · ':''}${fdate(p.date)}</div><div class="row" style="margin-top:6px"><span class="badge bd-pl">${fa(s.pct)}٪ بررسی‌شده</span><span class="badge bd-bad">${fa(s.bad)} ایراد باز</span><span class="badge bd-ok">${fa(s.fixed)} رفع‌شده</span></div></div>`}).join('');
 return`<div class="row"><button class="btn" data-act="newproj">+ پروژه / شیت جدید</button><button class="btn o" data-act="export">پشتیبان‌گیری</button><button class="btn o" data-act="import">بازیابی</button></div><input type="file" id="imp" accept=".json,application/json" hidden>
 ${L||'<div class="card mut">هنوز پروژه‌ای نداری. با «پروژه / شیت جدید» شروع کن؛ نام فضاها (مثلاً پذیرایی، اتاق خواب ۱) را همان‌جا می‌نویسی.</div>'}
 <div class="hint">نکته: اطلاعات فقط روی همین گوشی ذخیره می‌شود. گاهی از «پشتیبان‌گیری» فایل بگیر و برای خودت بفرست.</div>`}
function viewList(p,s){
 const sp=p.spaces.map(x=>esc(x.name)).join('، ');
 let h=`<div class="stat"><div><b style="color:var(--ok)">${fa(s.ok)}</b>درست</div><div><b style="color:var(--bad)">${fa(s.bad)}</b>ایراد</div><div><b>${fa(s.todo)}</b>مانده</div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><span class="mut">فضاها: ${sp}</span><button class="btn o s" data-act="editproj">ویرایش فضاها / پروژه</button></div>
 <div class="row" style="margin-top:6px"><select id="flt" style="width:auto"><option value="all"${filt==='all'?' selected':''}>نمایش همه موارد</option><option value="rem"${filt==='rem'?' selected':''}>فقط باقی‌مانده (بررسی‌نشده و ایراددار)</option></select></div>
 <div class="mut" style="margin-top:4px">روی هر فضا بزن: ○ ← ✔ ← ✖ (ثبت ایراد) ← — (مربوط نیست). رنگ نارنجی = نیاز به چک مجدد.</div></div>`;
 SEC.forEach(([sn,items],a)=>{const i=a+1;let body='',nb=0,done=0,tot=0;
  items.forEach((tx,j)=>{const cs=cellsOf(p,i);let all=true;const chips=cs.map(c=>{const e=p.checks[ck(i,j,c.sid)]||{};const st=e.st||'todo';tot++;if(st==='ok'||st==='na')done++;if(st==='bad')nb++;if(!(st==='ok'||st==='na'))all=false;return`<button class="chip st-${st}${e.recheck&&!e.st?' rc':''}" data-act="cyc" data-i="${i}" data-j="${j}" data-s="${c.sid}">${esc(c.name)}<b>${ICON[st]}</b></button>`}).join('');
   if(filt==='rem'&&all)return;
   body+=`<div class="it"><div class="tx">${esc(tx)}</div><div class="chips">${chips}${cs.length>1?`<button class="allok" data-act="allok" data-i="${i}" data-j="${j}">همه ✔</button>`:''}</div></div>`});
  if(filt==='rem'&&!body)return;
  h+=`<details class="sec" data-sec="${i}"${openSecs.has(i)?' open':''}><summary>${fa(i)}. ${esc(sn)}${PLAN.has(i)?' <span class="badge bd-pl">کل پلان</span>':''}${nb?` <span class="badge bd-bad">${fa(nb)} ایراد</span>`:''}${tot&&done===tot?' <span class="badge bd-ok">کامل</span>':''}</summary>${body}<div class="secnote"><textarea data-secnote="${i}" placeholder="یادداشت این بخش…">${esc(p.secNotes[i]||'')}</textarea></div></details>`});
 return h}
function viewRep(p,s){const all=issues(p);let L=all;
 if(repFilt==='open')L=all.filter(x=>x.e.fix!=='fixed');else if(repFilt==='fixed')L=all.filter(x=>x.e.fix==='fixed');else if(repFilt==='urg')L=all.filter(x=>x.e.pri==='urgent'&&x.e.fix!=='fixed');
 const f=(k,t)=>`<button class="btn s ${repFilt===k?'':'o'}" data-act="rf" data-k="${k}">${t}</button>`;
 let h=`<div class="stat"><div><b style="color:var(--bad)">${fa(s.bad)}</b>باز</div><div><b style="color:var(--ok)">${fa(s.fixed)}</b>رفع‌شده</div><div><b style="color:var(--bad)">${fa(s.urg)}</b>فوری</div><div><b>${fa(s.todo)}</b>بررسی‌نشده</div></div>
 ${s.todo?`<div class="hint" style="margin-top:8px">${fa(s.todo)} مورد هنوز بررسی نشده. <a href="#" data-act="gorem">نمایش در چک‌لیست</a></div>`:''}
 <div class="row" style="margin:8px 0">${f('all','همه')}${f('open','باز')}${f('urg','فوری')}${f('fixed','رفع‌شده')}</div>`;
 let last=0;L.forEach(x=>{if(x.i!==last){h+=`<div class="mut" style="margin-top:10px"><b>${fa(x.i)}. ${esc(x.sn)}</b></div>`;last=x.i}
  h+=`<div class="card${x.e.fix==='fixed'?' fx':''}"><div class="row"><span class="tag">${esc(x.sp)}</span>${x.e.pri==='urgent'?'<span class="urg">فوری</span>':''}${x.e.fix==='fixed'?'<span class="badge bd-ok">رفع‌شده</span>':''}</div><div>${esc(x.tx)}</div>${x.e.note?`<div class="nt">${esc(x.e.note)}</div>`:''}${(x.e.photos||[]).length?`<div class="ph">${x.e.photos.map(id=>`<img data-ph="${id}" alt="">`).join('')}</div>`:''}<div class="row"><button class="btn o s" data-act="edit" data-k="${x.key}">ویرایش</button><button class="btn o s" data-act="togfix" data-k="${x.key}">${x.e.fix==='fixed'?'باز کردن مجدد':'رفع شد ✓'}</button></div></div>`});
 if(!L.length)h+='<div class="card mut">ایرادی در این فیلتر نیست.</div>';
 h+=`<div class="card"><b>خروجی و ریویژن</b><div class="row" style="margin-top:8px"><button class="btn" data-act="share">ارسال / کپی متن گزارش</button><button class="btn o" data-act="print">چاپ / ذخیره PDF</button></div><div class="row" style="margin-top:8px"><button class="btn o" data-act="rev">ریویژن جدید (فقط موارد باقی‌مانده)</button></div></div>`;
 return h}
// ---- modal
function modal(h){const m=$('modal');m.innerHTML='<div class="box">'+h+'</div>';m.style.display='flex'}
function closeModal(){$('modal').style.display='none';$('modal').innerHTML=''}
let ME=null;
function projForm(p){const isN=!p;const q=p||{name:'',client:'',sheet:'',reviewer:'',date:today(),spaces:[{id:'',name:'فضا ۱'},{id:'',name:'فضا ۲'},{id:'',name:'فضا ۳'}]};
 ME={pid:p&&p.id};
 modal(`<b>${isN?'پروژه / شیت جدید':'ویرایش پروژه'}</b><label>نام پروژه</label><input type="text" id="f_name" value="${esc(q.name)}"><label>کارفرما</label><input type="text" id="f_client" value="${esc(q.client)}"><label>شماره شیت / نام پلان</label><input type="text" id="f_sheet" value="${esc(q.sheet)}"><label>بازبین</label><input type="text" id="f_rev" value="${esc(q.reviewer)}"><label>تاریخ</label><input type="date" id="f_date" value="${esc(q.date)}">
 <label>نام فضاها (هر چند تا که لازم است)</label><div id="spl">${q.spaces.map(sp=>`<div class="spr"><input type="text" class="spin" data-id="${sp.id}" value="${esc(sp.name)}"><button class="btn d s" data-act="rmsp">✕</button></div>`).join('')}</div><button class="btn o s" data-act="addsp">+ افزودن فضا</button>
 ${p&&p.history.length?`<label>تاریخچه ریویژن‌ها</label>${p.history.map(h=>`<div class="mut">R${fa(h.rev)} · ${fdate(h.date)} · ${fa(h.pct)}٪ بررسی، ${fa(h.bad)} ایراد باز، ${fa(h.fixed)} رفع‌شده</div>`).join('')}`:''}
 <div class="row" style="margin-top:12px"><button class="btn" data-act="saveproj">ذخیره</button><button class="btn o" data-act="close">بستن</button>${p?'<button class="btn o" data-act="dup">کپی خالی برای شیت دیگر</button><button class="btn d" data-act="delproj">حذف پروژه</button>':''}</div>`)}
let TMP=null;
function issueForm(key){const p=P(),[i,j,sid]=key.split('.'),e=p.checks[key]||(p.checks[key]={st:'bad'});const sp=sid==='plan'?'کل پلان':(p.spaces.find(x=>x.id===sid)||{}).name;
 TMP={key,photos:[...(e.photos||[])],added:[],removed:[]};
 modal(`<b>ثبت ایراد</b><div class="mut">${esc(SEC[i-1][0])} · ${esc(sp||'')}</div><div style="margin:6px 0">${esc(SEC[i-1][1][j])}</div><label>توضیح ایراد / چه چیزی باید اصلاح شود</label><textarea id="i_note">${esc(e.note||'')}</textarea><label>اولویت</label><select id="i_pri"><option value="normal"${e.pri!=='urgent'?' selected':''}>عادی</option><option value="urgent"${e.pri==='urgent'?' selected':''}>فوری</option></select><label>وضعیت</label><select id="i_fix"><option value="open"${e.fix!=='fixed'?' selected':''}>باز</option><option value="fixed"${e.fix==='fixed'?' selected':''}>رفع شد</option></select>
 <label>عکس / اسکرین‌شات</label><div class="ph" id="i_ph"></div><input type="file" id="i_file" accept="image/*" hidden><button class="btn o s" data-act="addph">+ افزودن عکس</button>
 <div class="row" style="margin-top:12px"><button class="btn" data-act="saveissue">ذخیره</button><button class="btn o" data-act="cancelissue">بستن</button><button class="btn d" data-act="clearissue">حذف علامت</button></div>`);drawTmpPh()}
function drawTmpPh(){const b=$('i_ph');b.innerHTML=TMP.photos.map(id=>`<div class="w"><img data-ph="${id}" alt=""><button data-act="rmph" data-id="${id}">✕</button></div>`).join('');fillPhotos(b)}
// ---- reports
function reportText(p){const s=stats(p),L=issues(p).filter(x=>x.e.fix!=='fixed');let t=`گزارش بازبینی پلان\nپروژه: ${p.name}${p.client?' | کارفرما: '+p.client:''}${p.sheet?' | شیت: '+p.sheet:''}\nریویژن ${fa(p.rev)} | تاریخ: ${fdate(p.date)}${p.reviewer?' | بازبین: '+p.reviewer:''}\nخلاصه: ${fa(s.pct)}٪ بررسی‌شده، ${fa(s.bad)} ایراد باز (${fa(s.urg)} فوری)، ${fa(s.fixed)} رفع‌شده، ${fa(s.todo)} بررسی‌نشده\n`;
 if(!L.length)t+='\nایراد بازی ثبت نشده است.\n';let last=0,n=0;L.forEach(x=>{if(x.i!==last){t+=`\n■ ${fa(x.i)}. ${x.sn}\n`;last=x.i}n++;t+=`${fa(n)}) [${x.sp}] ${x.tx}${x.e.note?' — '+x.e.note:''}${x.e.pri==='urgent'?' (فوری)':''}\n`});
 const sn=Object.entries(p.secNotes).filter(([k,v])=>v&&v.trim());if(sn.length){t+='\nیادداشت بخش‌ها:\n';sn.forEach(([k,v])=>t+=`- ${SEC[k-1][0]}: ${v}\n`)}return t}
async function reportHTML(p){const s=stats(p),L=issues(p).filter(x=>x.e.fix!=='fixed');let h=`<h1>گزارش بازبینی پلان</h1><div>پروژه: <b>${esc(p.name)}</b>${p.client?' | کارفرما: '+esc(p.client):''}${p.sheet?' | شیت: '+esc(p.sheet):''} | ریویژن ${fa(p.rev)} | تاریخ: ${fdate(p.date)}${p.reviewer?' | بازبین: '+esc(p.reviewer):''}</div><div>${fa(s.pct)}٪ بررسی‌شده · ${fa(s.bad)} ایراد باز (${fa(s.urg)} فوری) · ${fa(s.fixed)} رفع‌شده · ${fa(s.todo)} بررسی‌نشده</div>`;
 let last=0,open=false,n=0;for(const x of L){if(x.i!==last){if(open)h+='</table>';h+=`<h3>${fa(x.i)}. ${esc(x.sn)}</h3><table><tr><th style="width:24px">#</th><th style="width:70px">فضا</th><th>مورد و توضیح</th><th style="width:50px">اولویت</th><th style="width:40px">وضعیت</th></tr>`;last=x.i;open=true}n++;
  let ph='';for(const id of x.e.photos||[]){const d=await phGet(id);if(d)ph+=`<img src="${d}">`}
  h+=`<tr><td>${fa(n)}</td><td>${esc(x.sp)}</td><td>${esc(x.tx)}${x.e.note?'<br><b>'+esc(x.e.note)+'</b>':''}${ph?'<br>'+ph:''}</td><td>${x.e.pri==='urgent'?'فوری':'عادی'}</td><td>باز</td></tr>`}
 if(open)h+='</table>';if(!L.length)h+='<p>ایراد بازی ثبت نشده است.</p>';return h}
// ---- actions
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec){const i=+d.dataset.sec;d.open?openSecs.add(i):openSecs.delete(i)}},true);
document.addEventListener('change',e=>{const t=e.target,p=P();
 if(t.id==='flt'){filt=t.value;render()}
 else if(t.dataset&&t.dataset.secnote&&p){p.secNotes[t.dataset.secnote]=t.value;save()}
 else if(t.id==='imp'&&t.files[0]){const fr=new FileReader();fr.onload=async()=>{try{const o=JSON.parse(fr.result);for(const [id,v] of Object.entries(o.photos||{}))await phPut(id,v);(o.projects||[]).forEach(q=>{const k=DB.projects.findIndex(x=>x.id===q.id);k>=0?DB.projects[k]=q:DB.projects.push(q)});save();render();toast('بازیابی شد')}catch(er){toast('فایل پشتیبان معتبر نیست')}};fr.readAsText(t.files[0])}
 else if(t.id==='i_file'&&t.files[0]){resize(t.files[0]).then(async d=>{const id=uid();await phPut(id,d);TMP.photos.push(id);TMP.added.push(id);drawTmpPh()}).catch(()=>toast('عکس خوانده نشد'));t.value=''}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,p=P();if(b.tagName==='A')e.preventDefault();
 if(a==='tab'){if(!p&&b.dataset.t!=='proj'){toast('اول یک پروژه بساز یا باز کن');return}tab=b.dataset.t;render();window.scrollTo(0,0)}
 else if(a==='open'){DB.cur=b.dataset.id;save();tab='list';render();window.scrollTo(0,0)}
 else if(a==='newproj')projForm(null);
 else if(a==='editproj')projForm(p);
 else if(a==='addsp'){const d=document.createElement('div');d.className='spr';d.innerHTML=`<input type="text" class="spin" data-id="" value="فضا ${fa($('spl').children.length+1)}"><button class="btn d s" data-act="rmsp">✕</button>`;$('spl').appendChild(d)}
 else if(a==='rmsp'){if($('spl').children.length>1)b.parentElement.remove()}
 else if(a==='close')closeModal();
 else if(a==='saveproj'){const o={name:$('f_name').value.trim(),client:$('f_client').value.trim(),sheet:$('f_sheet').value.trim(),reviewer:$('f_rev').value.trim(),date:$('f_date').value||today()};const sps=[...document.querySelectorAll('.spin')].map(x=>({id:x.dataset.id,name:x.value.trim()||'فضا'}));
  if(!ME.pid){const q=newProject({...o,spaces:sps.map(x=>x.name)});DB.projects.unshift(q);DB.cur=q.id;tab='list'}
  else{const q=DB.projects.find(x=>x.id===ME.pid);Object.assign(q,o);const keep=new Set();q.spaces=sps.map(x=>{const id=x.id||uid();keep.add(id);return{id,name:x.name}});Object.keys(q.checks).forEach(k=>{const sid=k.split('.')[2];if(sid!=='plan'&&!keep.has(sid))delete q.checks[k]})}
  save();closeModal();render();window.scrollTo(0,0)}
 else if(a==='dup'){const q=newProject({name:p.name,client:p.client,reviewer:p.reviewer,spaces:p.spaces.map(x=>x.name)});q.name=p.name+' (کپی)';DB.projects.unshift(q);DB.cur=q.id;save();closeModal();render();toast('کپی خالی ساخته شد؛ نام شیت را ویرایش کن')}
 else if(a==='delproj'){if(confirm('این پروژه و همه ایرادهایش حذف شود؟')){Object.values(p.checks).forEach(e=>(e.photos||[]).forEach(phDel));DB.projects=DB.projects.filter(x=>x.id!==p.id);DB.cur=null;tab='proj';save();closeModal();render()}}
 else if(a==='cyc'){const key=ck(b.dataset.i,b.dataset.j,b.dataset.s),e=p.checks[key]||(p.checks[key]={}),o=[undefined,'ok','bad','na'];e.st=o[(o.indexOf(e.st)+1)%4];delete e.recheck;save();render();if(e.st==='bad'){e.pri=e.pri||'normal';e.fix='open';save();issueForm(key)}}
 else if(a==='allok'){const i=+b.dataset.i,j=+b.dataset.j;cellsOf(p,i).forEach(c=>{const k=ck(i,j,c.sid),e=p.checks[k]||(p.checks[k]={});if(!e.st){e.st='ok';delete e.recheck}});save();render()}
 else if(a==='edit')issueForm(b.dataset.k);
 else if(a==='togfix'){const e=p.checks[b.dataset.k];e.fix=e.fix==='fixed'?'open':'fixed';save();render()}
 else if(a==='rf'){repFilt=b.dataset.k;render()}
 else if(a==='gorem'){filt='rem';tab='list';render();window.scrollTo(0,0)}
 else if(a==='addph')$('i_file').click();
 else if(a==='rmph'){const id=b.dataset.id;TMP.photos=TMP.photos.filter(x=>x!==id);if(TMP.added.includes(id)){phDel(id);TMP.added=TMP.added.filter(x=>x!==id)}else TMP.removed.push(id);drawTmpPh()}
 else if(a==='saveissue'){const e=p.checks[TMP.key];e.note=$('i_note').value.trim();e.pri=$('i_pri').value;e.fix=$('i_fix').value;e.photos=TMP.photos;TMP.removed.forEach(phDel);TMP=null;save();closeModal();render()}
 else if(a==='cancelissue'){TMP.added.forEach(phDel);TMP=null;closeModal();render()}
 else if(a==='clearissue'){const e=p.checks[TMP.key];(e.photos||[]).concat(TMP.added).forEach(phDel);delete p.checks[TMP.key];TMP=null;save();closeModal();render()}
 else if(a==='share'){const t=reportText(p);if(navigator.share){try{await navigator.share({title:'گزارش بازبینی پلان',text:t})}catch(er){}}else{try{await navigator.clipboard.writeText(t);toast('متن گزارش کپی شد')}catch(er){toast('کپی نشد')}}}
 else if(a==='print'){$('pa').innerHTML=await reportHTML(p);setTimeout(()=>window.print(),150)}
 else if(a==='rev'){const s=stats(p);if(!confirm(`ریویژن ${fa(p.rev+1)} ساخته شود؟\nایرادهای «رفع‌شده» برای چک مجدد به حالت بررسی‌نشده برمی‌گردند و بقیه موارد حفظ می‌شوند.`))return;
  p.history.push({rev:p.rev,date:p.date,pct:s.pct,bad:s.bad,fixed:s.fixed});Object.values(p.checks).forEach(e=>{if(e.st==='bad'&&e.fix==='fixed'){e.st=undefined;e.recheck=true;e.fix='open'}});p.rev++;p.date=today();filt='rem';save();tab='list';render();window.scrollTo(0,0);toast('ریویژن جدید: فقط موارد باقی‌مانده نمایش داده می‌شود')}
 else if(a==='export'){const ph={};for(const q of DB.projects)for(const e of Object.values(q.checks))for(const id of e.photos||[]){const d=await phGet(id);if(d)ph[id]=d}
  const blob=new Blob([JSON.stringify({v:1,projects:DB.projects,photos:ph})],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='plancheck-backup-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('فایل پشتیبان ساخته شد')}
 else if(a==='import')$('imp').click()});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!TMP)closeModal()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
